<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>type conversion</title>
</head>
<body>
    <script>
        let num1=Number(prompt("Enter number 1:"));
        let num2=Number(prompt("Enter number 2:"));//type conversion from string to number 
        document.write("sum is:"+(num1+num2)+"<br>");
        let num3=parseInt(prompt("Enter number 3:"));//also convert string into number
         let num4=parseInt(prompt("Enter number 4:"));
         document.write("sum is:"+(num3+num4)+"<br>");
         let num5=parseFloat(prompt("Enter number 5:"));//convert string into decimal
         let num6=parseFloat(prompt("Enter number 6:"));
         document.write("sum is:"+(num5+num6)+"<br>");

    </script>
</body>
</html>
