<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js loops</title>
</head>
<body>
  <script>
   let n=Number(prompt("Enter number whose multiplication table you want"));
   for(i=1;i<=10;i++){
    document.write(n+"x"+i+"="+(n*i)+"<br>");
   }
  </script>
</body>
</html>
