<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css grid</title>
    <style>
        .container{
            display:grid;
            /*grid-template-columns: repeat(4,1fr);Columns display*/
            grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
            grid-gap:20px;
            grid-auto-rows: minmax(100px,auto);
            grid-auto-columns: minmax(50px,auto);
           /* column-gap:120px;
            row-gap:120px;*/
         }
        .item{
            background-color:lightblue;
            border:1px solid black;
        }
        /*#item-2{
            grid-row-start:2;
            grid-row-end: 3;
            grid-column-start:2;
            grid-column-end:3;
        }*/
        #item-1{
          grid-column-start: 1;
          grid-column-end:5;
        }
       .item-1-container{
        display:grid;
        grid-template-columns:repeat(3,1fr);
        column-gap:100px;
        row-gap:100px;
       }
       .nc{
        background-color: rgb(4, 4, 59);
        border:3px solid rgb(86, 235, 227);
        color:aliceblue;
        
       }
    </style>

</head>
<body>
    <div class="container">
    <div class="item item-1-container" id="item-1">
        <div class="nc">box in box1</div>
        <div class="nc">box in box2</div>
        <div class="nc">box in box3</div>
    </div>
    <div class="item" id="item-2">box 2</div>
    <div class="item">box 3</div>
    <div class="item">box 4</div>
    <div class="item">box 5</div>
    
   
    </div>
</body>
</html>
