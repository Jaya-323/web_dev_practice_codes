<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js variables and data types</title>
</head>
<body>
    <script>
        let name="abc";<!--Var allows to change values and redeclare it , Let allows to change value but not redeclare it and Const not allow any among them-->

        let age=20;
        var app="Javascript is used";
        app="Hello";
        const pi=3.14;
        document.write(name);
        document.write("<br>");
        document.write(typeof age);
        document.write("<br>");
        document.write(app);
        document.write("<br>");
        document.write(pi);

    </script>
</body>
</html>
