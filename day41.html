<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js week predictor</title>
</head>
<body>
    <script>
        let day=Number(prompt("Enter the day:"));
        switch(day){
            case 1:
            document.write("OOHO IT'S MONDAY");
            break;
            case 2:
            document.write("Yeah its tuesday");
            break;
             case 3:
            document.write("Almost half of week wednesday");
            break;
             case 4:
            document.write("Finally thursday one day left to weekend ");
            break;
             case 5:
            document.write("Yippe finally friday its holiday now");
            break;
             case 6:
            document.write("waah lets enjoy saturday");
            break;
             case 7:
            document.write("Oh no its sunday why holiday gets over so fast");
            break;
            default:
            document.write("Which day is today");
            
        }
        
        </script>
    
</body>
</html>
