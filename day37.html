<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js operators</title>
</head>
<body>
    <script>
           //comparison operator
        let d="5";
        let e=5;
        document.write(d==e);//equal
        document.write("<br>");
        document.write(d===e);//strict equal
        document.write("<br>");
        document.write(d==e|| d===e);//logical operator
        document.write("<br>");
      
    </script>
</body>
</html>
