<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js operators</title>
</head>
<body>
    <script>
        let a=3;
        let b=5;
        c=a+b; //Airthmetic operators
        document.write(c+"<br>");
        c=b-a;
        document.write(c+"<br>");
        c=b*a;
        document.write(c+"<br>");
        c=b/a;
        document.write(c+"<br>");
        c=a**b;
        document.write(c+"<br>");
        a+=b;//Assignmnet operators(-=,/=,*= , =)
        document.write(a);
        document.write("<br")
        a++;//increment opeartor
        document.write(a);
        document.write("<br")
        a--;//decrement operator
        document.write(a);
        document.write("<br")
     

    </script>
</body>
</html>
