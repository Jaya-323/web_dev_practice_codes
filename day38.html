<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js output and input</title>
</head>
<body>
    <script>
        let name=prompt("Enter your name");//prompt is used for input
        document.write(name);//this will write in webpage
        alert("Welcome to the webpage");//this will show written message in popup
        console.log("Hello to the console window output is written using console.log()");//this will write the output in console window
        let question=prompt("What will be 25*25");
        document.write(question);
        let answer=confirm("Are you sure about the answer?");//this will show two buttons ok and cancel ok means true and cancel means false
        document.write(answer);
    </script>
</body>
</html>
