<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conditional statement in js</title>
</head>
<body>
    <script>
        let marks=parseFloat(prompt("Enter your marks"))
        if(marks>=35){
            document.write("Pass")
        }
        else{
            document.write("Fail")
        }
    </script>
</body>
</html>
